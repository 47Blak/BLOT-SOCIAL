<svg viewBox="0 0 230 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue Gradient with 3D Depth Lighting -->
    <linearGradient id="blue3DGrad" x1="50" y1="280" x2="230" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066d6" />
      <stop offset="50%" stop-color="#004397" />
      <stop offset="100%" stop-color="#001d4a" />
    </linearGradient>

    <!-- Orange/Gold Gradient with Highlight Curve -->
    <linearGradient id="orange3DGrad" x1="20" y1="280" x2="230" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9d1c" />
      <stop offset="60%" stop-color="#f77d00" />
      <stop offset="100%" stop-color="#d95b00" />
    </linearGradient>

    <!-- Drop Shadow Filter for Layer Elevation -->
    <filter id="layerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-2" dy="-3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Outer Orange Shadow onto White Background -->
    <filter id="orangeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-1" dy="-2" stdDeviation="3" flood-color="#f77d00" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Gold/Orange 3D Base Layer -->
  <path
    d="M 60 280 C 110 270, 195 190, 228 110 L 230 110 L 230 280 Z"
    fill="url(#orange3DGrad)"
    filter="url(#orangeShadow)"
  />

  <!-- 2. Blue 3D Top Layer with Cast Shadow -->
  <path
    d="M 15 280 C 105 270, 180 220, 230 170 L 230 280 Z"
    fill="url(#blue3DGrad)"
    filter="url(#layerShadow)"
  />

  <!-- 3. Specular Edge Highlight (Rim Lighting) on Top Blue Ribbon -->
  <path
    d="M 15 280 C 105 270, 180 220, 230 170"
    stroke="rgba(255, 255, 255, 0.35)"
    stroke-width="1.5"
    fill="none"
  />
</svg>
